<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭开支 · Family Expenses</title>

<style>
  /* 账本 — the page IS the paper. No cards, no boxes: a typographic ledger.
     Ink on warm paper, one cinnabar seal-red accent (buttons, active tab, due),
     green stamp for paid, blue ink for money owed back. Rows are hairline-ruled
     full-bleed lines; the summary is a single hero figure, not a card grid.
     Chinese-first: medium weights, 1.6 line-height, tabular numerals.
     html tracks iOS Dynamic Type (large-text setting scales everything). */
  :root {
    --bg:#f6f2e9; --card:#f6f2e9; --text:#211d15; --muted:#7a7160;
    --line:#e3dcc9; --rule:#c9c0a8;
    --accent:#b5402c; --accent-soft:#f3e2da;
    --danger:#b5402c; --ok:#3f7d54;
    --due:#b5402c; --due-soft:#f3e2da;
    --lend:#46589a; --lend-soft:#e7ebf5;
    --radius:8px;
  }
  @media (prefers-color-scheme: dark) {
    /* night ink: warm near-black paper, brightened seal red, softened inks */
    :root { --bg:#131110; --card:#131110; --text:#eae4d3; --muted:#9c937e;
      --line:#2c2920; --rule:#48422f;
      --accent:#e57a5f; --accent-soft:#3a1e16;
      --danger:#e57a5f; --ok:#6cc08b;
      --due:#e57a5f; --due-soft:#3a1e16;
      --lend:#94a7e0; --lend-soft:#232a40; }
  }
  * { box-sizing:border-box; }
  html { font:-apple-system-body; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    font-size:1em; }
  a { color:var(--accent); }

  header { position:sticky; top:0; z-index:20; background:var(--bg);
    padding:12px 16px 8px; padding-top:calc(12px + env(safe-area-inset-top));
    display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header h1 { font-size:.92rem; margin:0; font-weight:500; letter-spacing:.18em;
    color:var(--muted); display:flex; align-items:center; gap:8px; }
  header h1::before { content:""; width:9px; height:9px; background:var(--accent);
    border-radius:2px; flex:0 0 auto; }
  .wrap { max-width:560px; margin:0 auto;
    padding:4px 16px calc(88px + env(safe-area-inset-bottom)); }

  /* ---- summary: one hero figure, the rest a ruled tally ---- */
  .cards { display:block; margin:2px 0 6px; }
  .card { background:none; border:0; border-radius:0; padding:0; min-width:0; }
  .card.due { padding:6px 0 14px; }
  .card.due .k { font-size:.78rem; }
  .card.due .v { font-size:2.9rem; font-weight:350; letter-spacing:-.02em;
    line-height:1.15; margin-top:2px; }
  .card .k { font-size:.75rem; color:var(--muted); font-weight:600;
    letter-spacing:.1em; display:flex; align-items:center; gap:7px; }
  .card .v { font-size:1rem; font-weight:600; overflow-wrap:anywhere;
    line-height:1.3; font-variant-numeric:tabular-nums; }
  .card .n { font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .card:not(.due) { display:flex; align-items:baseline; gap:8px;
    border-top:1px solid var(--line); padding:9px 0; }
  .card:not(.due) .k { flex:1 1 auto; }
  .card:not(.due) .n { display:none; }
  .card.due .v { color:var(--due); }
  .card.lend .v { color:var(--lend); }
  .dot { width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .dot.due { background:var(--due); } .dot.lend { background:var(--lend); }
  .dot.ok { background:var(--ok); } .dot.soon { background:var(--muted); }

  /* ---- tabs: bottom dock; active tab is a cinnabar seal ---- */
  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; gap:6px;
    background:var(--bg); border-top:1px solid var(--line);
    padding:8px 16px calc(8px + env(safe-area-inset-bottom)); }
  .tab { flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius);
    font-size:.94rem; font-weight:600; letter-spacing:.14em; cursor:pointer; border:0;
    background:transparent; color:var(--muted); min-width:0;
    transition:background .15s, color .15s; }
  .tab.on { background:var(--accent); color:var(--bg); }

  /* ---- forms: underlined fields on the paper, no boxes ---- */
  label { display:block; font-size:.75rem; color:var(--muted); margin:12px 0 0;
    font-weight:600; letter-spacing:.08em; }
  input, select, button, textarea { font:inherit; width:100%; color:var(--text);
    background:transparent; border:0; border-bottom:1px solid var(--rule);
    border-radius:0; padding:8px 2px; }
  input:focus, select:focus { outline:none; border-bottom:1.5px solid var(--accent); }
  select { -webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, currentColor 50%),
      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position:calc(100% - 12px) 55%, calc(100% - 7px) 55%;
    background-size:5px 5px; background-repeat:no-repeat; }
  input[type="date"] { min-height:44px; }
  .row { display:flex; gap:16px; } .row > * { flex:1 1 0; min-width:0; }
  button.primary { background:var(--accent); border:0; color:var(--bg);
    font-weight:600; letter-spacing:.2em; margin-top:18px; cursor:pointer;
    font-size:.98rem; padding:13px; border-radius:var(--radius); }
  .panel { background:none; border:0; border-radius:0; padding:0; margin-bottom:12px; }
  details.add { border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:2px 0; margin:4px 0 2px; }
  details.add summary { cursor:pointer; font-weight:600; font-size:.9rem;
    letter-spacing:.06em; color:var(--accent); list-style:none;
    display:flex; align-items:center; gap:8px; padding:10px 2px; }
  details.add summary::-webkit-details-marker { display:none; }
  details.add summary::before { content:"＋"; font-weight:600; }
  details.add[open] summary::before { content:"−"; }
  details.add form { padding:0 2px 16px; }

  /* ---- section headings: ruled like an account book ---- */
  .sec { display:flex; align-items:baseline; justify-content:space-between;
    gap:8px; margin:26px 0 0; padding-bottom:6px; border-bottom:1px solid var(--rule); }
  .sec h2 { font-size:.78rem; margin:0; color:var(--text);
    text-transform:uppercase; letter-spacing:.16em; font-weight:600; }
  .sec .tot { font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; }

  /* ---- expense list: bare ruled lines, no container ---- */
  .list { background:none; border:0; border-radius:0; overflow:visible; }
  .item + .item, details.add + * .item:first-child { border-top:1px solid var(--line); }
  .item { border-top:1px solid var(--line); }
  .list .item:first-child { border-top:0; }
  .item.open { background:var(--accent-soft); border-radius:var(--radius);
    border-top-color:transparent; margin:0 -8px; padding:0 8px; }
  .item.open + .item { border-top-color:transparent; }
  .ex-hd { display:flex; gap:12px; align-items:baseline; padding:10px 0; cursor:pointer; }
  .item.open .ex-hd { padding:10px 0 6px; }
  .ex-txt { flex:1 1 auto; min-width:0; }
  .ex-desc { font-weight:550; overflow-wrap:anywhere; line-height:1.45; }
  .ex-sub { font-size:.76rem; color:var(--muted); margin-top:1px;
    overflow-wrap:anywhere; line-height:1.5; }
  .ex-amt { flex:0 0 auto; white-space:nowrap; font-weight:600;
    font-variant-numeric:tabular-nums; }
  .st { font-weight:600; }
  .st.due  { color:var(--due); }
  .st.paid { color:var(--ok); }
  .st.soon { color:var(--muted); }
  .st.lend { color:var(--lend); }
  .item.paid .ex-desc, .item.paid .ex-amt { color:var(--muted); font-weight:450; }
  .btns { display:flex; gap:8px; padding:2px 0 12px; }
  /* an author `display` beats the UA sheet's [hidden]{display:none}, so a
     hidden .btns stayed on screen — every class row showed its Delete */
  .btns[hidden], .histbox[hidden], .clsdate[hidden], .row > [hidden] { display:none; }
  .clsdate label { margin:0 0 2px; }
  .btns button { padding:9px 4px; font-size:.8rem; cursor:pointer;
    border:1px solid var(--rule); border-radius:var(--radius); background:transparent; }
  .btns .pay { color:var(--ok); border-color:var(--ok); font-weight:600; }
  .btns .del { color:var(--danger); }
  .editbox, .histbox { padding:0 0 14px; }
  .hist { font-size:.75rem; color:var(--muted); margin:3px 0; overflow-wrap:anywhere; }
  /* inline × that removes one logged class from a course */
  .hist .lnk { width:auto; display:inline; border:0; padding:0 4px; cursor:pointer;
    color:var(--danger); font-size:.85rem; line-height:1; background:transparent; }
  .empty { text-align:center; color:var(--muted); padding:22px 8px 10px; font-size:.88rem; }

  /* ---- history: a bare statement ---- */
  .stmt { width:100%; border-collapse:collapse; font-size:.88rem; margin-top:8px; }
  .stmt th { text-align:right; font-size:.68rem; color:var(--muted); font-weight:600;
    text-transform:uppercase; letter-spacing:.1em; padding:0 0 7px;
    border-bottom:1px solid var(--rule); }
  .stmt th:first-child { text-align:left; }
  .stmt td { padding:10px 0; border-top:1px solid var(--line); text-align:right;
    font-variant-numeric:tabular-nums; }
  .stmt tbody tr:first-child td { border-top:0; }
  .stmt td:first-child { text-align:left; font-weight:600; }
  .stmt td.n { color:var(--muted); font-size:.8rem; }
  .stmt td.out { color:var(--due); font-weight:600; }
  .stmt td.zero { color:var(--rule); }
  .stmt tr.mrow { cursor:pointer; }
  .stmt tr.grp td { padding:16px 0 6px; border-top:0; font-size:.66rem;
    letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .stmt tr.mrow.soon td { color:var(--muted); }
  .stmt tr.mrow:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .caret { display:inline-block; width:1em; color:var(--muted);
    transition:transform .15s; transform:translateY(-1px); }
  .stmt tr.mrow.open .caret { transform:rotate(90deg); }
  .stmt tr.drow > td { padding:0 0 6px 12px; border-top:0; }
  .detail .list { border-left:2px solid var(--accent-soft); padding-left:10px; }

  /* ---- stats: bare charts on the paper; marks ONE hue (cinnabar) ---- */
  .viz { --mark:#c04a34; --grid:#e3dcc9; --axis:#c9c0a8; }
  @media (prefers-color-scheme: dark) { .viz { --mark:#d97258; --grid:#2c2920; --axis:#48422f; } }
  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; margin-bottom:16px; }
  .kpi .t { background:none; border:0; border-radius:0; border-top:1px solid var(--line);
    padding:9px 0 8px; min-width:0; }
  .kpi .t .k { font-size:.72rem; color:var(--muted); font-weight:600; letter-spacing:.08em; }
  .kpi .t .v { font-size:1.25rem; font-weight:600; margin-top:1px; overflow-wrap:anywhere;
    font-variant-numeric:tabular-nums; }
  .kpi .t .s { font-size:.68rem; color:var(--muted); }
  .chart { background:none; border:0; border-radius:0; padding:0; margin-bottom:22px; }
  .chart h3 { font-size:.78rem; margin:0 0 1px; font-weight:600;
    text-transform:uppercase; letter-spacing:.14em; color:var(--text);
    padding-bottom:6px; border-bottom:1px solid var(--rule); }
  .chart .cap { font-size:.7rem; color:var(--muted); margin:5px 0 12px; }
  .chart svg { width:100%; height:auto; display:block; overflow:visible; }
  .chart text { fill:var(--muted); font-size:9.5px;
    font-family:inherit; font-variant-numeric:tabular-nums; }
  .chart text.val { fill:var(--text); font-weight:650; }
  .chart text.name { fill:var(--text); font-size:10px; }
  .chart .bar { fill:var(--mark); }
  .chart .grid { stroke:var(--grid); stroke-width:1; }
  .chart .base { stroke:var(--axis); stroke-width:1; }
  .viz .sec { margin-top:10px; border-bottom:0; padding-bottom:0; }
  .viz .sec h2 { color:var(--muted); }

  .toast { position:fixed; left:50%; transform:translateX(-50%); z-index:40;
    bottom:calc(80px + env(safe-area-inset-bottom));
    background:var(--text); color:var(--bg); border-radius:var(--radius);
    padding:10px 18px; font-size:.9rem; opacity:0; transition:opacity .2s;
    pointer-events:none;
    /* the add confirmation echoes the stored row — description, date and
       amount — which is far longer than the one-word toasts this started as.
       Centred by translateX(-50%) with no width bound, it ran off both edges
       of a phone and the confirmation could not be read. */
    max-width:min(92vw, 420px); text-align:center; overflow-wrap:anywhere; }
  .toast.show { opacity:.96; }
  .lang { width:auto; padding:5px 2px; border:0; cursor:pointer;
    font-size:.8rem; flex:0 0 auto; background:transparent;
    color:var(--accent); font-weight:600; letter-spacing:.1em; min-height:44px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <button class="lang" id="langBtn"></button>
</header>

<div class="wrap">
  <section id="pane-now">
    <div class="cards" id="cards"></div>
    <details class="add" id="addWrap">
      <summary data-i18n="add"></summary>
      <form id="addForm">
        <div class="row">
          <div>
            <label for="amount" data-i18n="amount"></label>
            <input id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required="" placeholder="0.00">
          </div>
          <div>
            <label for="date" data-i18n="due"></label>
            <input id="date" type="date" required="">
          </div>
        </div>
        <label for="desc" data-i18n="desc"></label>
        <input id="desc" type="text" data-i18n-ph="desc_ph">
        <label for="category" data-i18n="category"></label>
        <select id="category"></select>
        <button type="submit" class="primary" data-i18n="save_new"></button>
      </form>
    </details>
    <div id="nowBody"></div>
  </section>

  <section id="pane-history" hidden=""><div class="panel" id="historyBody"></div></section>
  <section id="pane-stats" hidden=""><div id="statsBody"></div></section>

  <section id="pane-classes" hidden="">
    <details class="add" id="addClsWrap">
      <summary data-i18n="cls_add"></summary>
      <form id="addClsForm" autocomplete="off">
        <label for="clsExpense" data-i18n="cls_payment"></label>
        <select id="clsExpense" required=""></select>
        <div class="row">
          <div>
            <label for="clsName" data-i18n="cls_name"></label>
            <input id="clsName" type="text" required="">
          </div>
          <div>
            <label for="clsCount" data-i18n="cls_count"></label>
            <input id="clsCount" type="number" min="1" step="1" required="">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="clsKind" data-i18n="cls_kind"></label>
            <select id="clsKind"></select>
          </div>
          <div id="clsPeriodWrap">
            <label for="clsPeriod" data-i18n="cls_period"></label>
            <input id="clsPeriod" type="text" data-i18n-ph="cls_period_ph">
          </div>
        </div>
        <div class="hist" id="clsRateHint"></div>
        <button type="submit" class="primary" data-i18n="cls_save"></button>
      </form>
    </details>
    <div id="classesBody"></div>
  </section>
</div>
<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="now"></button>
  <button class="tab" data-tab="classes"></button>
  <button class="tab" data-tab="history"></button>
  <button class="tab" data-tab="stats"></button>
</nav>
<div class="toast" id="toast"></div>

  };

  var lang = localStorage.getItem("fe.lang") || "zh";
  var tab = "now";
  var expenses = [];
  var summary = {};
  var packages = [];    // class tracker, loaded by refreshClasses()
  var openPkgs = {};     // which courses are expanded, across re-renders
  // A date she has explicitly picked, per course. It exists ONLY so the pick
  // survives the re-render another row's tap causes — it never decides what
  // gets logged; the box does. Empty ⇒ the box shows today.
  var clsDates = {};
  // which courses have a log request in flight. Outside the DOM on purpose:
  // a re-render replaces a disabled button with an enabled one.
  var clsBusy = {};
  var candidates = [];  // payments not yet tracked by a package

  function t(key) { var v = STR[lang][key]; return typeof v === "string" ? v : key; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n) { return "¥" + Number(n || 0).toLocaleString(undefined,
    {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function money0(n) { return "¥" + Math.round(Number(n || 0)).toLocaleString(); }
  // chart-only: keeps 12 monthly labels from bleeding into each other.
  // Exact amounts stay available in the History tab.
  function moneyK(n) {
    n = Math.round(Number(n || 0));
    if (Math.abs(n) >= 10000) return "¥" + Math.round(n / 1000) + "k";
    if (Math.abs(n) >= 1000) return "¥" + (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return "¥" + n.toLocaleString();
  }
  // The server's today, in the household's timezone (APP_TZ), delivered by
  // /api/list. Everything on this page — overdue or not, which month is
  // current, where the History past/future line falls — used to come from the
  // phone's clock, which can disagree with the server that decides the same
  // things. The device is only the fallback for the first paint.
  var serverToday = null;   // YYYY-MM-DD as of the last successful /api/list
  var serverTodayAt = 0;    // Date.now() when that arrived
  var serverMidnightIn = null;  // seconds from then to the household's midnight
  var resyncing = false;    // one extrapolation-triggered refetch per page load
  function addDays(ymd, n) {
    // parsed and formatted in UTC on purpose: these are calendar dates, and a
    // local-time round trip across a DST boundary lands on the wrong day
    var d = new Date(Date.parse(ymd + "T00:00:00Z") + n * 86400000);
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") +
      "-" + String(d.getUTCDate()).padStart(2,"0");
  }
  function todayStr() {
    if (serverToday) {
      // Advance it by however long the page has been open. Pinning the
      // server's answer forever would be worse than trusting the phone: a tab
      // left open overnight would keep offering yesterday as the payment date
      // — and an accepted default writes a wrong date into the ledger, which
      // then lands in the wrong month's paid total.
      // Elapsed time is a proxy for a date, not a date. It is only sound while
      // the device clock runs at the right RATE: an NTP correction or a manual
      // change mid-session reads as time passing. So the estimate is capped at
      // one day and we go ask the server instead — an unbounded extrapolation
      // would put a payment date in the FUTURE, the same wrong-month error
      // arriving from the other side. Bounded to ±1 day either way.
      // Roll over AT midnight, not 24h after the response that told us the
      // date. Elapsed time alone meant a page opened at 23:50 kept offering
      // yesterday until 23:50 the NEXT day. The page cannot work this out
      // itself — a date says nothing about how much of it is left — so the
      // server sends the seconds remaining alongside it.
      var elapsed = (Date.now() - serverTodayAt) / 1000;
      var days = serverMidnightIn === null
        ? Math.floor(elapsed / 86400)
        : (elapsed < serverMidnightIn
             ? 0 : 1 + Math.floor((elapsed - serverMidnightIn) / 86400));
      if (days > 1) {
        days = 1;
        if (!resyncing) { resyncing = true; refresh(); }  // once per page load
      }
      return days > 0 ? addDays(serverToday, days) : serverToday;
    }
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function daysBetween(a, b) {  // whole days from a to b, both YYYY-MM-DD
    return Math.round((Date.parse(b + "T00:00:00") - Date.parse(a + "T00:00:00")) / 86400000);
  }
  function categoryLabel(e) {
    var map = STR[lang].cat;
    return (e.category && map[e.category]) ? map[e.category] : (e.category || "");
  }
  function isBorrow(e) { return e.category === BORROW; }
  // Both comparators return 0 for equal dates. The History tab's scheduled
  // branch used `a.date > b.date ? -1 : 1`, which claims a>b AND b>a for two
  // rows on the same day — an inconsistent comparator, and its order is
  // implementation-defined. Two rows dated 2026-09-30 are exactly that case.
  function byDateAsc(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }
  function byDateDesc(a, b) { return byDateAsc(b, a); }

  // `ms` is optional: a confirmation that names what was written needs longer
  // on screen than "已保存". Shortening the message to fit the old 1.7s would
  // throw away the part that makes it a confirmation at all.
  function toast(msg, ms) {
    var el = $("toast"); el.textContent = msg; el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, ms || 1700);
  }
  function api(name, body) {
    body = body || {}; body.token = TOKEN;
    return fetch("/api/" + name, {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) {
      if (!r.ok || !j.ok) {
        var err = new Error(j.error || t("err"));
        // the server answered and refused: nothing was written. A rejection
        // WITHOUT this flag is ambiguous — the request may have committed and
        // its response been lost — which the class log has to treat differently
        err.answered = true;
        throw err;
      } return j; }); });
  }

  // ---- tabs ----
  $("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest("[data-tab]");
    if (!b) return;

    $("pane-classes").hidden = tab !== "classes";

    $("pane-stats").hidden = tab !== "stats";
    // the class tab has its own payload; fetch it the first time it is
    // opened rather than on every page load
    if (tab === "classes") { refreshClasses(); return; }

  // ---- month expand/collapse ----
  // The expanded rows are siblings of the month row, not descendants, so a tap
  // on an action button inside a month never bubbles up and collapses it.
  function toggleMonth(m) {

  function toggleItem(id) {

    // guard toggleItem(null) ran and re-rendered the class tab, closing the
    // row the class handler had just opened — the whole tab looked inert.
    if (item && item.getAttribute("data-id")) toggleItem(item.getAttribute("data-id"));
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter" && ev.key !== " ") return;

    if (!hd) return;

    // Class rows reuse .ex-hd but carry data-pkg, not data-id. Without this
    // guard toggleItem(null) ran and re-rendered the class tab, closing the
    // row the class handler had just opened — the whole tab looked inert.

  // ---- summary cards ----
  function renderCards() {
    var s = summary || {};
    var paidMonth = expenses.filter(function (e) {
      return e.paid && !isBorrow(e) && (e.paid_date || "").slice(0,7) === todayStr().slice(0,7);

    var html =
      '<div class="card due"><div class="k"><span class="dot due"></span>' + esc(t("due_now")) + '</div>' +
        '<div class="v">' + esc(money0(s.due_now)) + '</div>' +
        '<div class="n">' + esc(String(s.due_now_count || 0)) + '</div></div>' +

  // ---- one list row ----
  // Returns {cls, text} rather than markup so the caller escapes once, at the
  // point of interpolation.
  function stateOf(e) {
    if (e.paid) return { cls:"paid", text:t("st_paid") + (e.paid_date ? " " + e.paid_date : "") };
    if (isBorrow(e)) return { cls:"lend", text:t("st_lent") + " " + e.date };
    var d = daysBetween(todayStr(), e.date);
    if (d < 0) return { cls:"due", text:t("overdue_by") + " " + (-d) + t("days") };
    if (d === 0) return { cls:"due", text:t("today") };
    if (d === 1) return { cls:"due", text:t("tomorrow") };
    return { cls:"soon", text:e.date };
  }

  function section(titleKey, rows, emptyKey) {

    return '<div class="sec"><h2>' + esc(t(titleKey)) + "</h2>" +

                   : '<div class="empty">' + esc(t(emptyKey)) + "</div>");

  // ---- tab 1: what is actually due, then what was actually paid ----
  function renderNow() {
    var today = todayStr(), month = today.slice(0, 7);
    // ONE unpaid list, split in two — not two independent predicates. The Due
    // tab used to render `<= 30` and nothing else, so a row due in 50 days
    // appeared in no list and no card: she added a ¥1,980 course, the page did
    // not move, and she added it again. Both rows are in production.
    // Partitioning a single list means no row can fall between the halves the
    // way it fell off the end of the old one.
    var unpaid = expenses.filter(function (e) { return !e.paid && !isBorrow(e); });
    // ONE predicate and its NEGATION — not `<= 30` beside `> 30`. Those two
    // are not complementary whenever the comparison is not a number: `NaN` is
    // neither, so such a row rendered in NO section and we were back where we
    // started. Verified under node: '2026-13-01', '2026-00-10', '2026-01-32'
    // and a null/missing date all give `Date.parse` NaN. ('2026-02-30' does
    // NOT — it normalises silently to early March and sorts as an ordinary
    // row. Only the store can catch that one.) `!inWindow` has no such hole
    // whatever the comparison returns.
    var inWindow = function (e) { return daysBetween(today, e.date) <= 30; };
    var due = unpaid.filter(inWindow).sort(byDateAsc);
    // Rendered expanded, like every other section. Collapsed-by-default plus a
    // rule about when to auto-open it would be a second source of truth about
    // what she can see, which is the shape that caused this bug's neighbours.
    var later = unpaid.filter(function (e) { return !inWindow(e); }).sort(byDateAsc);

    var lent = expenses.filter(function (e) { return !e.paid && isBorrow(e); })
      .sort(byDateAsc);

    var byPaidDate = function (a, b) {
      var x = a.paid_date || "", y = b.paid_date || "";
      return x > y ? -1 : x < y ? 1 : 0;
    };
    // 本月已付 is HOUSEHOLD SPENDING, so borrow is excluded — P4, and the
    // summary card directly above already excluded it. They did not agree: the
    // card read ¥24,399 and this header read ¥55,499 over the same two words,
    // the ¥31,100 gap being a repayment of money she had fronted.
    var thisMonth = function (e) { return (e.paid_date || "").slice(0, 7) === month; };
    var paid = expenses.filter(function (e) {
      return e.paid && !isBorrow(e) && thisMonth(e);
    }).sort(byPaidDate);
    // …and it goes HERE rather than nowhere. Dropping borrow from 本月已付
    // without this is the same defect the section above was added to fix:
    // 待还我 carries only what is still owed, so a repayment would have
    // vanished from the tab entirely.
    var repaid = expenses.filter(function (e) {
      return e.paid && isBorrow(e) && thisMonth(e);
    }).sort(byPaidDate);

    var html = section("sec_due", due, "empty_due");
    if (later.length) html += section("sec_later", later, "empty_all");
    if (lent.length) html += section("sec_lent", lent, "empty_all");
    html += section("sec_paid", paid, "empty_paid");
    if (repaid.length) html += section("sec_repaid", repaid, "empty_all");
    $("nowBody").innerHTML = html;
  }

  // ---- tab 2: statement, one row per month, expandable ----
  // Which months are open is component state, not derived from the data, so it
  // survives the re-render that follows marking something paid from inside an
  // expanded month — otherwise the section would snap shut under your finger.
  var openMonths = {};

  function renderHistory() {
    var by = {};
    expenses.forEach(function (e) {
      var m = (e.date || "").slice(0, 7);
      if (!m) return;
      if (!by[m]) by[m] = { m:m, n:0, spent:0, out:0, items:[] };
      by[m].n += 1;
      by[m].items.push(e);
      if (e.paid) by[m].spent += Number(e.amount || 0);
      else by[m].out += Number(e.amount || 0);
    });
    var thisMonth = todayStr().slice(0, 7);
    var keys = Object.keys(by).sort();
    // what has happened, most recent first — the question she actually asks
    var rows = keys.filter(function (k) { return k <= thisMonth; }).reverse()
                   .map(function (k) { return by[k]; });
    // what is merely scheduled, soonest first, kept out of the way below
    var future = keys.filter(function (k) { return k > thisMonth; })
                     .map(function (k) { return by[k]; });
    if (!rows.length && !future.length) {
      $("historyBody").innerHTML = '<div class="empty">' + esc(t("empty_all")) + "</div>";
      return;
    }
    // Finding 4b: computed over BOTH groups. Scoping it to past/current meant a
    // fully-settled history hid the Outstanding column for the scheduled rows
    // that actually had money in it.
    var anyOut = rows.concat(future).some(function (r) { return r.out > 0; });
    var cols = anyOut ? 4 : 3;

    $("historyBody").innerHTML =
      '<table class="stmt"><thead><tr>' +
        "<th>" + esc(t("month")) + "</th><th>" + esc(t("txns")) + "</th>" +
        "<th>" + esc(t("spent")) + "</th>" +
        (anyOut ? "<th>" + esc(t("outstanding")) + "</th>" : "") +
      "</tr></thead><tbody>" +
      rows.map(function (r) {
        var open = !!openMonths[r.m];
        var head =
          '<tr class="mrow' + (open ? " open" : "") + '" data-month="' + esc(r.m) + '"' +
            ' role="button" tabindex="0" aria-expanded="' + (open ? "true" : "false") + '">' +
            '<td><span class="caret">›</span>' + esc(r.m) + "</td>" +
            '<td class="n">' + esc(String(r.n)) + "</td>" +
            "<td>" + esc(money0(r.spent)) + "</td>" +
            (anyOut ? '<td class="' + (r.out ? "out" : "zero") + '">' +
              (r.out ? esc(money0(r.out)) : "–") + "</td>" : "") +
          "</tr>";
        if (!open) return head;
        // due date DESCENDING within the month — reads like a statement, and
        // the scheduled branch below matches. (This said "ascending" while
        // sorting the other way for four releases.)
        var items = r.items.slice().sort(byDateDesc);
        return head +
          '<tr class="drow"><td colspan="' + cols + '">' +
            '<div class="detail">' + listHtml(items) + "</div>" +
          "</td></tr>";
      }).join("") +
      (future.length
        ? '<tr class="grp"><td colspan="' + cols + '">' + esc(t("scheduled")) + "</td></tr>" +
          future.map(function (r) {
            // same open state and same ARIA as a past month: this branch was
            // written separately and drifted, so a scheduled month announced
            // itself to a screen reader as a plain row and never rotated its
            // caret. It is the same control.
            var fopen = !!openMonths[r.m];
            return '<tr class="mrow soon' + (fopen ? " open" : "") +
              '" data-month="' + esc(r.m) + '" role="button" tabindex="0"' +
              ' aria-expanded="' + (fopen ? "true" : "false") + '">' +
              '<td><span class="caret">›</span>' + esc(r.m) + "</td>" +
              '<td class="n">' + esc(String(r.n)) + "</td>" +
              "<td>" + esc(money0(r.spent)) + "</td>" +
              (anyOut ? '<td class="' + (r.out ? "out" : "zero") + '">' +
                (r.out ? esc(money0(r.out)) : "–") + "</td>" : "") + "</tr>" +
              (fopen
                ? '<tr class="drow"><td colspan="' + cols + '"><div class="detail">' +
                  listHtml(r.items.slice().sort(byDateDesc)) + "</div></td></tr>"
                : "");
          }).join("")
        : "") + "</tbody></table>";
  }

  // ---- tab 3: stats ----
  // Spend = paid, excluding borrow (she fronted that; repaying is not household
  // spending), bucketed by DUE month so this agrees with the statement tab.
  function lastMonths(n) {
    // anchored on the server's today like every other date decision here
    var parts = todayStr().split("-");
    var out = [], y = Number(parts[0]), m = Number(parts[1]) - 1;
    for (var i = n - 1; i >= 0; i--) {
      var dt = new Date(y, m - i, 1);
      out.push(dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0"));
    }
    return out;
  }
  function spendRows() {
    return expenses.filter(function (e) { return e.paid && !isBorrow(e); });
  }

  function barsSvg(series) {          // [{label, value, now}]
    var W = 320, H = 96, padB = 16, gap = 3;
    var max = Math.max.apply(null, series.map(function (s) { return s.value; }).concat([1]));
    var bw = (W - gap * (series.length - 1)) / series.length;
    var top = series.reduce(function (a, s, i) { return s.value > series[a].value ? i : a; }, 0);
    var body = series.map(function (s, i) {
      var h = Math.max(s.value > 0 ? 2 : 0, Math.round((s.value / max) * (H - padB - 14)));
      var x = i * (bw + gap), y = H - padB - h;
      var label = (i === top || s.now) && s.value > 0
        ? '<text class="val" x="' + (x + bw / 2) + '" y="' + (y - 4) +
          '" text-anchor="middle">' + esc(moneyK(s.value)) + "</text>"
        : "";
      // 4px rounded data-end, anchored to the baseline
      return '<rect class="bar" x="' + x + '" y="' + y + '" width="' + bw +
        '" height="' + h + '" rx="' + Math.min(4, bw / 2) + '"' +
        (s.now ? "" : ' opacity="' + (s.value ? 0.85 : 0.25) + '"') + "></rect>" + label +
        '<text x="' + (x + bw / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' +
        esc(s.label) + "</text>";
    }).join("");
    return '<svg viewBox="0 0 ' + W + " " + H + '" role="img">' +
      '<line class="base" x1="0" y1="' + (H - padB + 0.5) + '" x2="' + W +
      '" y2="' + (H - padB + 0.5) + '"></line>' + body + "</svg>";
  }

  function hbarsSvg(rows) {           // [{name, value}]
    var W = 320, rowH = 26, labelW = 96, valW = 62;
    var H = rows.length * rowH;
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
    var track = W - labelW - valW;
    var body = rows.map(function (r, i) {
      var y = i * rowH, w = Math.max(2, Math.round((r.value / max) * track));
      return '<text class="name" x="0" y="' + (y + rowH / 2 + 3) + '">' + esc(r.name) + "</text>" +
        '<rect class="bar" x="' + labelW + '" y="' + (y + 5) + '" width="' + w +
        '" height="' + (rowH - 12) + '" rx="3"></rect>' +
        '<text class="val" x="' + W + '" y="' + (y + rowH / 2 + 3) +
        '" text-anchor="end">' + esc(money0(r.value)) + "</text>";
    }).join("");
    return '<svg viewBox="0 0 ' + W + " " + H + '" role="img">' + body + "</svg>";
  }

  function renderStats() {
    var rows = spendRows();
    if (!rows.length && !expenses.length) {
      $("statsBody").innerHTML = '<div class="empty">' + esc(t("empty_all")) + "</div>";
      return;
    }
    var months = lastMonths(12), thisMonth = todayStr().slice(0, 7);
    var byMonth = {};
    months.forEach(function (m) { byMonth[m] = 0; });
    rows.forEach(function (e) {
      var m = (e.date || "").slice(0, 7);
      if (m in byMonth) byMonth[m] += Number(e.amount || 0);
    });

    // average over months that have actually happened and have spend
    var past = months.filter(function (m) { return m < thisMonth && byMonth[m] > 0; });
    var avg = past.length
      ? past.reduce(function (a, m) { return a + byMonth[m]; }, 0) / past.length : 0;

    var inWindow = rows.filter(function (e) { return months.indexOf((e.date || "").slice(0,7)) >= 0; });
    var sumWhere = function (pred) {
      return inWindow.filter(pred).reduce(function (a, e) { return a + Number(e.amount || 0); }, 0);
    };
    var aden = sumWhere(function (e) { return (e.category || "").indexOf("aden-") === 0; });
    var living = sumWhere(function (e) { return e.category === "living"; });

    var kpi =
      '<div class="kpi">' +
        '<div class="t"><div class="k">' + esc(t("kpi_avg")) + '</div><div class="v">' +
          esc(money0(avg)) + '</div><div class="s">' + esc(String(past.length) + t("kpi_mo")) + "</div></div>" +
        '<div class="t"><div class="k">' + esc(t("kpi_this")) + '</div><div class="v">' +
          esc(money0(byMonth[thisMonth] || 0)) + '</div><div class="s">' + esc(thisMonth) + "</div></div>" +
        '<div class="t"><div class="k">' + esc(t("kpi_living")) + '</div><div class="v">' +
          esc(money0(living)) + '</div><div class="s">' + esc(t("kpi_12mo")) + "</div></div>" +
        '<div class="t"><div class="k">' + esc(t("kpi_aden")) + '</div><div class="v">' +
          esc(money0(aden)) + '</div><div class="s">' + esc(t("kpi_12mo")) + "</div></div>" +
      "</div>";

    var series = months.map(function (m) {
      return { label:m.slice(5), value:byMonth[m], now:m === thisMonth };
    });

    // categories, largest first, tail folded into "other" — never more hues
    var byCat = {};
    inWindow.forEach(function (e) {
      var c = e.category || "other";
      byCat[c] = (byCat[c] || 0) + Number(e.amount || 0);
    });
    var cats = Object.keys(byCat).map(function (c) {
      return { name: (STR[lang].cat[c] || c), value: byCat[c] };
    }).sort(function (a, b) { return b.value - a.value; });
    if (cats.length > 8) {
      var tail = cats.slice(7).reduce(function (a, r) { return a + r.value; }, 0);
      cats = cats.slice(0, 7).concat([{ name:STR[lang].cat.other, value:tail }]);
    }

    $("statsBody").innerHTML =
      '<div class="viz">' + kpi +
      '<div class="chart"><h3>' + esc(t("ch_monthly")) + "</h3>" +
        '<div class="cap">' + esc(t("ch_monthly_cap")) + "</div>" +
        barsSvg(series) + "</div>" +
      (cats.length ?
      '<div class="chart"><h3>' + esc(t("ch_cat")) + "</h3>" +
        '<div class="cap">' + esc(t("ch_cat_cap")) + "</div>" +
        hbarsSvg(cats) + "</div>" : "") +
      borrowBlock(months) +
      "</div>";
  }

  // ---- what I've fronted, and whether it comes back ----
  function borrowBlock(months) {
    var all = expenses.filter(isBorrow);
    if (!all.length) return "";
    var inWindow = all.filter(function (e) { return months.indexOf((e.date || "").slice(0,7)) >= 0; });
    var sum = function (rows) {
      return rows.reduce(function (a, e) { return a + Number(e.amount || 0); }, 0);
    };
    var outstanding = all.filter(function (e) { return !e.paid; });
    var repaid = inWindow.filter(function (e) { return e.paid && e.paid_date; });

    // how long repayment actually takes — fronted date → repaid date
    var waits = repaid.map(function (e) { return daysBetween(e.date, e.paid_date); })
                      .filter(function (d) { return d >= 0; });
    var avgWait = waits.length
      ? Math.round(waits.reduce(function (a, d) { return a + d; }, 0) / waits.length) : null;
    // how long the oldest unpaid one has been sitting
    var oldest = outstanding.reduce(function (a, e) {
      var d = daysBetween(e.date, todayStr());
      return d > a ? d : a;
    }, 0);

    var tiles =
      '<div class="t"><div class="k">' + esc(t("lent")) + '</div><div class="v">' +
        esc(money0(sum(outstanding))) + '</div><div class="s">' +
        esc(String(outstanding.length) + t("kpi_items")) + "</div></div>" +
      '<div class="t"><div class="k">' + esc(t("kpi_fronted")) + '</div><div class="v">' +
        esc(money0(sum(inWindow))) + '</div><div class="s">' + esc(t("kpi_12mo")) + "</div></div>" +
      '<div class="t"><div class="k">' + esc(t("kpi_repaid")) + '</div><div class="v">' +
        esc(money0(sum(repaid))) + '</div><div class="s">' +
        esc(String(repaid.length) + t("kpi_items")) + "</div></div>" +
      '<div class="t"><div class="k">' + esc(t("kpi_wait")) + '</div><div class="v">' +
        (avgWait === null ? "–" : esc(String(avgWait) + t("days"))) + '</div><div class="s">' +
        esc(outstanding.length ? t("kpi_oldest") + " " + oldest + t("days") : t("kpi_settled")) +
        "</div></div>";

    var byMonth = {};
    months.forEach(function (m) { byMonth[m] = 0; });
    inWindow.forEach(function (e) {
      var m = (e.date || "").slice(0, 7);
      if (m in byMonth) byMonth[m] += Number(e.amount || 0);
    });
    var thisMonth = todayStr().slice(0, 7);
    var series = months.map(function (m) {
      return { label:m.slice(5), value:byMonth[m], now:m === thisMonth };
    });

    return '<div class="sec"><h2>' + esc(t("sec_borrow")) + "</h2></div>" +
      '<div class="kpi">' + tiles + "</div>" +
      '<div class="chart"><h3>' + esc(t("ch_borrow")) + "</h3>" +
        '<div class="cap">' + esc(t("ch_borrow_cap")) + "</div>" +
        barsSvg(series) + "</div>";
  }

  // ---- tab 4: class tracker ----
  // A package holds no money of its own — every figure here is derived by the
  // server from the linked payment, so this renders what it is told and never
  // recomputes a total. Two shapes: a per_class pack draws down, a period fee
  // owes back what did not happen.
  function clsLine(p) {
    var s = p.summary;
    if (p.kind === "per_class") {
      return {
        big: s.remaining + "/" + s.class_count,
        sub: t("cls_rate") + " " + money(s.rate) + " · " +
             t("cls_used") + " " + s.used +
             (s.overrun ? " · " + t("cls_over") + " " + s.overrun : ""),
        amt: t("cls_left") + " " + money(s.remaining_amount),
        cls: s.remaining > 0 ? "soon" : "paid",
      };
    }
    return {
      big: String(s.owed),
      sub: t("cls_rate") + " " + money(s.rate) + " · " +
           t("cls_reclaim") + " " + money(s.reclaimable_amount) +
           " (" + s.reclaimable + ") · " +
           t("cls_forfeit") + " " + money(s.forfeited_amount) + " (" + s.forfeited + ")" +
           // the counts are honest about what happened; the money stops at
           // what was paid. Without saying so, a "(2)" beside ¥0.00 reads as
           // a bug rather than as a cap.
           (s.overrun ? " · " + t("cls_capped") + " " + s.overrun : ""),
      amt: t("cls_owed") + " " + money(s.owed_amount),
      cls: s.owed > 0 ? "lend" : "paid",
    };
  }

  function renderClasses() {
    var sel = $("clsExpense");
    // a row tap re-renders the whole tab, and rebuilding the options resets
    // the selection to the first payment — she would then link the course to
    // whichever expense happens to be at the top
    var keepPayment = sel.value;
    // only payments not already tracked: one payment, one package, or the same
    // money would be counted twice
    // escaped per value, not once around the concatenation: the guard in
    // ClassKindParityTests reads it that way, and so does the next person
    var payLabels = withUnique(candidates.map(function (e) {
      return esc(e.description || categoryLabel(e) || "–") + " · " +
        esc(money0(e.amount)) + " · " + esc(e.date);
    }), candidates.map(function (e) { return e.id; }));
    sel.innerHTML = candidates.length
      ? candidates.map(function (e, i) {
          return '<option value="' + esc(e.id) + '">' + payLabels[i] + "</option>";
        }).join("")
      : '<option value="">' + esc(t("cls_no_payment")) + "</option>";
    if (keepPayment) sel.value = keepPayment;
    clsRateHint();

    var body = $("classesBody");
    if (!packages.length) {
      body.innerHTML = '<div class="empty">' + esc(t("cls_none")) + "</div>";
      return;
    }
    var titles = withUnique(packages.map(function (p) {
        // A per_class pack carries no period label (the form stopped asking),
        // so without the payment behind it two terms of 足球课 render byte for
        // byte the same — and a class logged against the wrong one moves both
        // rows' figures while both still look right. The payment DESCRIPTION,
        // not its date: two terms bought in one sitting share a date, and the
        // description is where she already writes the month ("Football (8月)").
        // escaped per value rather than around the ||-chain: `esc()` maps a
        // null to "", so the fallbacks still work, and the P6 guard can see
        // every field is wrapped without having to parse the expression
        return esc(p.name) + " · " + (esc(p.period_label) ||
          esc(p.expense.description) || esc(p.expense.date));
      }), packages.map(function (p) { return p.id; }));
    body.innerHTML = '<div class="sec"><h2>' + esc(t("cls_sec")) + "</h2><span class='tot'>" +
      esc(packages.length + " " + t("cls_cls")) + "</span></div><div class='list'>" +
      packages.map(function (p, idx) {
        var L = clsLine(p);
        var title = titles[idx];
        var isOpen = !!openPkgs[p.id];
        return '<div class="item' + (isOpen ? " open" : "") + '" data-pkg="' +
          esc(p.id) + '">' +
          '<div class="ex-hd"><div class="ex-txt">' +
            '<div class="ex-desc">' + title + ' <span class="st ' + L.cls + '">' +
              esc(L.big) + "</span></div>" +
            '<div class="ex-sub">' + esc(L.sub) + "</div>" +
          '</div><div class="ex-amt">' + esc(L.amt) + "</div></div>" +
          // The date the buttons below will log against. A phone user was
          // being asked to type "2026-08-05" into a prompt(); the picker also
          // gets to say 上课日期 rather than the 到期日 the prompt borrowed.
          //
          // The box is the SOURCE OF TRUTH: the log handler posts whatever
          // this input holds. Nothing is inferred from events, which is what
          // makes a re-pick of the value already shown work — `<input
          // type="date">` fires no `change` at all in that case. An earlier
          // version pinned today into clsDates here instead and froze the row
          // on the day it was opened.
          //
          // `for`/`id` rather than wrapping the input: `input { font:inherit }`
          // inside a `label { font-size:.75rem; font-weight:600 }` renders the
          // date tiny, bold and letter-spaced.
          '<div class="clsdate"' + (isOpen ? "" : ' hidden=""') + ">" +
            '<label for="c-date-' + esc(p.id) + '">' + esc(t("cls_date")) +
              '</label><input type="date" class="c-date" id="c-date-' +
                esc(p.id) + '" value="' + esc(clsDateFor(p)) + '"' +
                // a write is in flight for this course: she cannot change the
                // date under it, which is what removes the "did she pick during
                // the request?" ambiguity rather than trying to detect it. A
                // repaint would otherwise draw a live-looking box over a
                // locked course.
                (clsBusy[p.id] ? ' disabled=""' : "") + "></div>" +
          '<div class="btns"' + (isOpen ? "" : ' hidden=""') +
            (clsBusy[p.id] ? ' data-busy=""' : "") + ">" +
            (p.kind === "per_class"
              ? '<button class="pay" data-c="attended">' + esc(t("cls_attend")) + "</button>"
              : "") +
            '<button data-c="missed_school">' + esc(t("cls_cancel")) + "</button>" +
            '<button data-c="missed_us">' + esc(t("cls_skip")) + "</button>" +
            '<button class="del" data-c="delpkg">' + esc(t("del")) + "</button>" +
          "</div>" +
          '<div class="histbox"' + (isOpen ? "" : ' hidden=""') + ">" +
            clsEvents(p) + "</div>" +
        "</div>";
      }).join("") + "</div>";
  }

  function clsEvents(p) {
    if (!p.events.length) return '<div class="hist">–</div>';
    return p.events.map(function (e) {
      return '<div class="hist">' + esc(e.date) + " · " +
        esc(STR[lang].ev[e.kind] || e.kind) +
        (e.logged_by ? " · " + esc(e.logged_by) : "") +
        (e.note ? " · " + esc(e.note) : "") +
        ' <button class="lnk" data-unlog="' + esc(e.id) + '" data-when="' +
          esc(e.date + " · " + (STR[lang].ev[e.kind] || e.kind)) +
          '">×</button></div>';
    }).join("");
  }

  function withUnique(labels, ids) {
    // Two rows that read the same are a wrong-course log waiting to happen —
    // and the sub-line does not save them, since two terms of one course cost
    // the same and start at the same count. The id is the only handle unique
    // by construction (it is what the MCP falls back to as well), so it is
    // appended ONLY where the visible text actually collides.
    var n = {};
    labels.forEach(function (l) { n[l] = (n[l] || 0) + 1; });
    return labels.map(function (l, i) {
      // the FULL id, not a fragment: ids are 12 hex characters and two of
      // them can share any prefix, so a 4-char slice left two courses reading
      // alike — the wrong-course log this exists to prevent. It is also the
      // handle the MCP falls back to, so she can read it out to the owner.
      return n[l] > 1 ? l + " · " + esc(String(ids[i])) : l;
    });
  }

  function clsDateFor(p) {
    // What the box shows: her pick if she made one, otherwise today — computed
    // fresh, so any re-render after midnight corrects an untouched row.
    // An earlier attempt PINNED today here instead. That did make the box and
    // the tap agree, by freezing them: a row opened at 23:50 then showed and
    // logged yesterday for the rest of the page's life, immune even to a
    // refresh. The box being the single source of truth is what makes them
    // agree now (see the log handler), not a stored copy.
    return clsDates[p.id] || todayStr();
  }

  function clsKindFields() {
    // a pack of N classes is counted in classes, not in months, so 周期 has
    // nothing to label there. Cleared as it goes: a hidden field that still
    // submits what she typed is the exact shape of bug this file keeps finding.
    var per = $("clsKind").value === "per_class";
    $("clsPeriodWrap").hidden = per;
    if (per) $("clsPeriod").value = "";
  }

  function clsRateHint() {
    var el = $("clsRateHint"), chosen = $("clsExpense").value;
    var pick = candidates.filter(function (c) { return c.id === chosen; })[0];
    var n = parseInt($("clsCount").value, 10);
    el.textContent = (pick && n > 0)
      ? t("cls_rate") + " " + money(pick.amount / n) + "  (" + money0(pick.amount) +
        " ÷ " + n + ")"
      : "";
  }

  function render() {
    // cards live inside the "now" pane, so they only cost work when it is shown
    if (tab === "now") { renderCards(); renderNow(); }
    else if (tab === "classes") renderClasses();
    else if (tab === "history") renderHistory();
    else renderStats();
  }

  function refresh() {
    return api("list", {status:"all"}).then(function (j) {
      expenses = j.expenses || [];
      summary = j.summary || {};
      if (j.today) {
        serverToday = j.today;
        serverTodayAt = Date.now();
        // set with the date, always: a fresh date beside a stale remaining-
        // seconds would roll the day over at the wrong moment
        serverMidnightIn = typeof j.midnight_in === "number" ? j.midnight_in : null;
        // the add form's date defaults to today; correct it if the phone was
        // a day out, but never overwrite a date she has already chosen
        var dateEl = $("date");
        if (!dateEl.dataset.touched) dateEl.value = serverToday;
      }
      render();
    }).catch(function (e) { toast(e.message); });
  }

  // ---- add ----
  // What was written, in the order she reads it. Falls back to the bare word
  // when the server sent no row back, so a response-shape change degrades to
  // the old confirmation instead of printing "undefined" over her ledger.
  function addedMsg(e) {
    // Needs a date AND a numeric amount to say anything true. A row missing
    // either printed "undefined" or ¥0.00 across her ledger — a confirmation
    // that is wrong is worse than one that is short. The form still clears:
    // api() rejects unless the server answered ok:true, so the row IS written,
    // and leaving her fields populated invites the second submit this whole
    // release exists to prevent.
    if (!e || !e.date || typeof e.amount !== "number") return t("added");
    return t("added") + " · " + (e.description || categoryLabel(e) || "–") +
      " · " + e.date + " · " + money(e.amount);
  }

  $("addForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    api("submit", {
      date: $("date").value || todayStr(),
      amount: parseFloat($("amount").value),
      category: $("category").value,
      description: $("desc").value.trim() || null,
    }).then(function (j) {
      $("amount").value = ""; $("desc").value = "";
      $("addWrap").open = false;
      // Confirm with the row the SERVER stored, never with the fields she
      // typed. The two are not the same thing — a cleared date becomes the
      // household's today, an amount is normalised — and echoing the form
      // would confirm a write that did not happen that way. It is the same
      // rule as the class date box: the value shown must be the value written.
      toast(addedMsg(j && j.expense), 3200);
      refresh();
    }).catch(function (e) { toast(e.message); });
  });

  // ---- per-item actions ----
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("button[data-act]") : null;
    if (!btn) return;
    var itemEl = btn.closest(".item");
    var id = itemEl.getAttribute("data-id");
    var exp = expenses.filter(function (e) { return e.id === id; })[0];
    if (!exp) return;
    var act = btn.getAttribute("data-act");

    if (act === "pay") {
      if (exp.paid) {
        api("mark-paid", {id:id, paid:false})
          .then(function () { toast(t("unmarked")); refresh(); })
          .catch(function (e) { toast(e.message); });
      } else {
        var d = prompt(t("paid_on"), todayStr());
        if (d === null) return;
        api("mark-paid", {id:id, paid:true, paid_date:d.trim()})
          .then(function () { toast(t("marked")); refresh(); })
          .catch(function (e) { toast(e.message); });
      }
    } else if (act === "del") {
      if (!confirm(t("confirm_del"))) return;
      api("delete", {id:id})
        .then(function () { toast(t("deleted")); refresh(); })
        .catch(function (e) { toast(e.message); });
    } else if (act === "edit") {
      var box = itemEl.querySelector(".editbox");
      if (box.style.display !== "none") { box.style.display = "none"; return; }
      box.style.display = "block";
      box.innerHTML =
        '<div class="row"><div><label>' + esc(t("amount")) + '</label>' +
          '<input type="number" step="0.01" min="0.01" class="e-amt" value="' + esc(exp.amount) + '"></div>' +
        '<div><label>' + esc(t("due")) + '</label>' +
          '<input type="date" class="e-date" value="' + esc(exp.date) + '"></div></div>' +
        '<label>' + esc(t("desc")) + '</label>' +
          '<input type="text" class="e-desc" value="' + esc(exp.description || "") + '">' +
        '<label>' + esc(t("category")) + '</label><select class="e-cat">' +
          CATS.map(function (c) {
            return '<option value="' + esc(c) + '"' + (exp.category === c ? " selected" : "") + ">" +
              esc(STR[lang].cat[c] || c) + "</option>"; }).join("") +
        "</select>" +
        '<div class="btns" style="margin-top:10px"><button class="pay" data-e="save">' + esc(t("save")) +
        '</button><button data-e="cancel">' + esc(t("cancel")) + "</button></div>";
      box.onclick = function (ev2) {
        var b2 = ev2.target.closest ? ev2.target.closest("button[data-e]") : null;
        if (!b2) return;
        ev2.stopPropagation(); ev2.preventDefault();
        if (b2.getAttribute("data-e") === "cancel") { box.style.display = "none"; return; }
        api("update", {id:id, fields:{
          amount: parseFloat(box.querySelector(".e-amt").value),
          description: box.querySelector(".e-desc").value.trim() || null,
          date: box.querySelector(".e-date").value,
          category: box.querySelector(".e-cat").value,
        }}).then(function () { toast(t("saved")); refresh(); })
          .catch(function (e) { toast(e.message); });
      };
    } else if (act === "hist") {
      var hbox = itemEl.querySelector(".histbox");
      if (hbox.style.display !== "none") { hbox.style.display = "none"; return; }
      api("history", {id:id}).then(function (j) {
        hbox.style.display = "block";
        hbox.innerHTML = (j.history || []).map(function (h) {
          var snap = h.snapshot || {};
          // an expense can be entered already-paid, which is a single 'create'
          // entry — without the date it carries, the trail would not say when
          // the money actually moved
          // Whenever the row is paid — not just on 'create'. The payment date
          // is typed into a prompt, so it can be any date: `changed_at` says
          // when the entry was made, `paid_date` when the money moved, and
          // gating this to one action silently dropped the second.
          var paidOn = (snap.paid && snap.paid_date)
            ? " · " + esc(t("paid_on")) + " " + esc(snap.paid_date) : "";
          return '<div class="hist">' + esc(String(h.changed_at).replace("T", " ")) + " · " +
            esc(STR[lang].act[h.action] || h.action) +
            (h.changed_by ? " · " + esc(h.changed_by) : "") +
            " · " + esc(money(snap.amount)) + paidOn + "</div>";
        }).join("") || '<div class="hist">–</div>';
      }).catch(function (e) { toast(e.message); });
    }
  });

  // ---- class tracker: fetch + actions ----
  // Every fetch carries a generation number. Tapping the tab (or logging a
  // class) can leave two requests in flight, and without this the slower —
  // older — response lands last and repaints stale totals over fresh ones.
  var clsGen = 0;
  function refreshClasses() {
    var gen = ++clsGen;
    return api("classes-list", {}).then(function (j) {
      if (gen !== clsGen) return;  // a newer request already answered
      packages = j.packages || [];
      candidates = j.candidates || [];
      if (j.today) { serverToday = j.today; serverTodayAt = Date.now();
        serverMidnightIn = typeof j.midnight_in === "number" ? j.midnight_in : null;
 }
      renderClasses();
    }).catch(function (e) { toast(e.message); });
  }

  $("clsExpense").addEventListener("change", clsRateHint);
  $("clsCount").addEventListener("input", clsRateHint);
  $("clsKind").addEventListener("change", clsKindFields);

  // the picker's date outlives the re-render that every log triggers
  $("classesBody").addEventListener("change", function (ev) {
    var dateEl = ev.target.closest && ev.target.closest(".c-date");
    var itemEl = ev.target.closest && ev.target.closest("[data-pkg]");
    if (!dateEl || !itemEl) return;
    // an emptied box is not a date. Put today back in both places rather than
    // leaving "" to fall through to today at tap time — the box would then
    // read blank while the tap wrote a date.
    if (!dateEl.value) dateEl.value = todayStr();
    clsDates[itemEl.getAttribute("data-pkg")] = dateEl.value;
  });

  $("addClsForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!$("clsExpense").value) { toast(t("cls_no_payment")); return; }
    api("classes-add", {
      expense_id: $("clsExpense").value,
      name: $("clsName").value.trim(),
      kind: $("clsKind").value,
      class_count: parseInt($("clsCount").value, 10),
      period_label: $("clsPeriod").value.trim() || null,
    }).then(function () {
      $("clsName").value = ""; $("clsCount").value = ""; $("clsPeriod").value = "";
      $("addClsWrap").open = false;
      toast(t("added")); refreshClasses();
    }).catch(function (e) { toast(e.message); });
  });

  $("classesBody").addEventListener("click", function (ev) {
    var itemEl = ev.target.closest && ev.target.closest("[data-pkg]");
    if (!itemEl) return;
    var id = itemEl.getAttribute("data-pkg");

    var unlog = ev.target.closest && ev.target.closest("[data-unlog]");
    if (unlog) {
      ev.stopPropagation();
      // a 12px × sitting next to the class log, one mis-tap from erasing an
      // attendance record — and on a period package, from handing the school
      // back a class it owed. It names the row it would delete.
      if (!confirm(t("cls_confirm_unlog") + "\n" + unlog.getAttribute("data-when"))) return;
      api("classes-unlog", {event_id: unlog.getAttribute("data-unlog")})
        .then(function () { toast(t("deleted")); refreshClasses(); })
        .catch(function (e) { toast(e.message); });
      return;
    }

    var b = ev.target.closest && ev.target.closest("button[data-c]");
    if (!b) {  // tapping the row opens its actions and its class log
      // …but the date picker lives inside the row, and opening it must not
      // count as a tap on the row itself — that closed the row underneath her
      if (ev.target.closest && ev.target.closest(".clsdate")) return;
      openPkgs[id] = !openPkgs[id];
      // a date picked and then abandoned must not wait, hidden, for the next
      // time this row is opened: closing the row is dropping the intent. The
      // memory exists for a re-render caused by ANOTHER row, which this is not.
      if (!openPkgs[id]) delete clsDates[id];
      renderClasses();
      return;
    }
    ev.stopPropagation();
    var act = b.getAttribute("data-c");
    if (act === "delpkg") {
      if (!confirm(t("cls_confirm_del"))) return;
      api("classes-delete", {id:id})
        .then(function () { toast(t("deleted")); refreshClasses(); })
        .catch(function (e) { toast(e.message); });
      return;
    }
    // THE BOX IS THE SOURCE OF TRUTH: post exactly the date she can see. Any
    // other rule — a stored copy, an inference from what the row was seeded
    // with — is a second value that can drift from the one on screen, and
    // every version of this that drifted did so silently. `clsDates` exists
    // only so a pick survives the re-render another row's tap causes; it never
    // decides what gets written. An emptied box reads "" and falls back.
    var dateEl = itemEl.querySelector(".c-date");
    var d = (dateEl && dateEl.value) || todayStr();
    // One log at a time PER COURSE, and the lock lives outside the DOM: a
    // disabled button is replaced by an enabled one the moment anything
    // re-renders, and it never covered the sibling buttons at all — so 停课
    // during an in-flight 上了 wrote two events. On a period package each
    // extra one claims another class back from the school.
    if (clsBusy[id]) return;
    clsBusy[id] = true;
    b.disabled = true;
    if (dateEl) dateEl.disabled = true;   // before any repaint, not only after
    function releaseCourse() {
      // the picker is re-found by id and re-enabled with the buttons. Leaving
      // it out left her with a dead date box whenever no repaint followed —
      // which is EVERY answered refusal (no refresh is requested) and any
      // success whose refreshClasses() then failed.
      clsBusy[id] = false;
      b.disabled = false;
      var el = document.getElementById("c-date-" + id);
      if (el) el.disabled = false;
    }
    // No timeout releases this lock. A 30s release was tried and is a WORSE
    // bug than the one it fixes: the request it gives up on may already have
    // committed server-side, so the retry it permits writes a second
    // class_events row — and both are counted by summarize_package, which
    // moves money. A course held until reload is visible and recoverable; a
    // duplicate class is neither. Safe release needs server-side idempotency
    // (BACKLOG §6), not a guess about whether the write landed.
    api("classes-log", {package_id:id, kind:act, date:d})
      .then(function () {
        // Back to today, so the next tap cannot silently reuse this one's
        // date — but only if the box still shows what we just logged. A slow
        // request outlives its own context and she may have picked since;
        // asking the BOX is the same question the tap asks, and unlike a
        // change-event counter it also sees a re-pick that fired no event.
        // Re-found by id, because a re-render has detached the row we captured.
        var live = document.getElementById("c-date-" + id);
        if (!live || live.value === d) {
          delete clsDates[id];
          if (live) live.value = todayStr();
        }
        toast(t("cls_logged") + " · " + d); refreshClasses();
      })
      .then(releaseCourse)
      .catch(function (e) {
        toast(e.message);
        // Release ONLY if the server answered — then we know nothing was
        // written. A network-level failure is ambiguous: the insert may have
        // committed and the reply been lost, and class_events has no
        // idempotency constraint (BACKLOG §6), so the retry an open lock
        // permits writes a SECOND row and summarize_package counts both.
        // Staying locked is visible and costs a reload; the duplicate is
        // neither visible nor recoverable.
        if (e && e.answered) releaseCourse();
      });
  });

  // ---- init ----
  $("date").value = todayStr();
  $("date").addEventListener("input", function () { this.dataset.touched = "1"; });
  // coming back to a backgrounded tab re-syncs the date with the server rather
  // than relying on the elapsed-time estimate in todayStr()
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) refresh();
  });
  applyLang();
  refresh();
})();
</script>


</body></html>
